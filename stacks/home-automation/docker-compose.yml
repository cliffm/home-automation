x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  home_automation:
    # Explicit name: the frigate stack attaches to this network
    name: home-automation_home_automation
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  traefik:
    name: traefik
    external: true

services:
  # PostgreSQL Database for Home Assistant
  postgres:
    container_name: postgres
    image: postgres:18.6
    restart: unless-stopped
    logging: *default-logging
    environment:
      - POSTGRES_DB=homeassistant
      - POSTGRES_USER=hass
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
      - TZ=${TIMEZONE:-America/New_York}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - home_automation
    ports:
      # Home Assistant (host network) connects via the LAN IP in secrets.yaml.
      # Switch that db_url to 127.0.0.1, then bind this to "127.0.0.1:5432:5432".
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hass -d homeassistant"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # pgAdmin for PostgreSQL Management
  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:9.19.0
    restart: unless-stopped
    logging: *default-logging
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@martin-ohana.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
      - PGADMIN_DISABLE_POSTFIX=true
      - TZ=${TIMEZONE:-America/New_York}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - /etc/localtime:/etc/localtime:ro
    networks:
      - home_automation
      - traefik
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--tries=1", "-O-", "http://localhost/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.pgadmin.rule=Host(`pgadmin.martin-ohana.com`)"
      - "traefik.http.routers.pgadmin.tls=true"
      - "traefik.http.routers.pgadmin.tls.certresolver=cloudflare"
      - "traefik.http.routers.pgadmin.entrypoints=websecure"
      - "traefik.http.routers.pgadmin.middlewares=local-only@file"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"
      - "com.centurylinklabs.watchtower.enable=true"

  # Home Assistant with PostgreSQL dependency
  # Using network_mode: host for full Bluetooth/mDNS/Thread access
  homeassistant:
    container_name: home-assistant
    image: ghcr.io/home-assistant/home-assistant:2026.11.1
    privileged: true
    network_mode: host
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - home_assistant_config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    environment:
      - TZ=${TIMEZONE:-America/New_York}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/manifest.json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homeassistant.rule=Host(`ha.martin-ohana.com`)"
      - "traefik.http.routers.homeassistant.tls=true"
      - "traefik.http.routers.homeassistant.tls.certresolver=cloudflare"
      - "traefik.http.routers.homeassistant.entrypoints=websecure"
      - "traefik.http.routers.homeassistant.middlewares=local-only@file"
      - "traefik.http.services.homeassistant.loadbalancer.server.url=http://${HOST_IP:-192.168.1.85}:8123"
      - "com.centurylinklabs.watchtower.enable=true"

  # ZWave-JS-UI with Traefik labels
  zwave-js-ui:
    container_name: zwave-js-ui
    image: zwavejs/zwave-js-ui:11.26.2
    restart: unless-stopped
    logging: *default-logging
    tty: true
    stop_signal: SIGINT
    devices:
      - "/dev/serial/by-id/usb-Nabu_Casa_ZWA-2_80B54EE5D184-if00:/dev/ttyACM0"
    volumes:
      - zwave_data:/usr/src/app/store
      - /etc/localtime:/etc/localtime:ro
    networks:
      - home_automation
      - traefik
    ports:
      # Z-Wave JS websocket; Home Assistant connects to ws://<LAN IP>:3000.
      # The web UI (8091) is only reachable through Traefik.
      - "3000:3000"
    environment:
      - TZ=${TIMEZONE:-America/New_York}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--tries=1",
          "-O-",
          "--header",
          "Accept: text/plain",
          "http://localhost:8091/health/zwave",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 3m
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.zwavejs.rule=Host(`zwavejs.martin-ohana.com`)"
      - "traefik.http.routers.zwavejs.tls=true"
      - "traefik.http.routers.zwavejs.tls.certresolver=cloudflare"
      - "traefik.http.routers.zwavejs.entrypoints=websecure"
      - "traefik.http.routers.zwavejs.middlewares=local-only@file"
      - "traefik.http.services.zwavejs.loadbalancer.server.port=8091"
      - "com.centurylinklabs.watchtower.enable=true"

  mqtt:
    container_name: mosquitto
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - mosquitto_config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    networks:
      - home_automation
    ports:
      - "1883:1883"
    environment:
      - TZ=${TIMEZONE:-America/New_York}
      # Only used by the healthcheck below; mosquitto itself reads its passwd file
      - MQTT_USER=${MQTT_USER:?set MQTT_USER in .env}
      - MQTT_PASS=${MQTT_PASS:?set MQTT_PASS in .env}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_pub -h 127.0.0.1 -p 1883 -t 'healthcheck' -m 'test' -q 0 -u \"$$MQTT_USER\" -P \"$$MQTT_PASS\" || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Node-RED with Traefik labels
  node-red:
    container_name: node-red
    image: nodered/node-red:5.0.9
    depends_on:
      - homeassistant
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - node_red_data:/data
      - ../../configs/home-assistant:/config:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - home_automation
      - traefik
    environment:
      - TZ=${TIMEZONE:-America/New_York}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1880/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 3m
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.nodered.rule=Host(`nodered.martin-ohana.com`)"
      - "traefik.http.routers.nodered.tls=true"
      - "traefik.http.routers.nodered.tls.certresolver=cloudflare"
      - "traefik.http.routers.nodered.entrypoints=websecure"
      - "traefik.http.routers.nodered.middlewares=local-only@file"
      - "traefik.http.services.nodered.loadbalancer.server.port=1880"
      - "com.centurylinklabs.watchtower.enable=true"

  esphome:
    image: ghcr.io/esphome/esphome:2026.6.3
    container_name: esphome
    volumes:
      - esphome_config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - ESPHOME_DASHBOARD_USE_PING=true
    restart: unless-stopped
    logging: *default-logging
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.esphome.rule=Host(`esphome.martin-ohana.com`)"
      - "traefik.http.routers.esphome.entrypoints=websecure"
      - "traefik.http.routers.esphome.tls.certresolver=cloudflare"
      - "traefik.http.routers.esphome.middlewares=local-only@file"
      - "traefik.http.services.esphome.loadbalancer.server.port=6052"

  cloudflare-ddns:
    image: favonia/cloudflare-ddns:1.18.0
    container_name: cloudflare-ddns
    restart: unless-stopped
    logging: *default-logging
    network_mode: host
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - DOMAINS=vaultwarden.martin-ohana.com
      - PROXIED=true
      - IP4_PROVIDER=url:https://api4.ipify.org
      - IP6_PROVIDER=none
      - UPDATE_CRON=@every 5m
      - TZ=${TIMEZONE:-America/New_York}

  # OpenThread Border Router (OTBR) for ZBT-1
  otbr:
    container_name: otbr
    # No version tags are published for this image, so pin by digest (2.15.3)
    image: ghcr.io/ownbee/hass-otbr-docker@sha256:0b1fb50d2d41fba288736994c1773a3768dbef24efdf56780d37e28cb08e3b70
    restart: unless-stopped
    logging: *default-logging
    privileged: true
    network_mode: host
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    environment:
      DEVICE: "/dev/ttyUSB0"
      BACKBONE_IF: enp89s0
      FLOW_CONTROL: 1
      FIREWALL: 1
      NAT64: 1
      BAUDRATE: 460800
      OTBR_REST_PORT: 8081
      OTBR_WEB_PORT: 8079
      AUTOFLASH_FIRMWARE: 0
    devices:
      - /dev/serial/by-id/usb-Nabu_Casa_Home_Assistant_Connect_ZBT-1_b82d1f7d6a12f01192c70a14773d9da9-if00-port0:/dev/ttyUSB0
      - /dev/net/tun:/dev/net/tun
    volumes:
      - otbr_data:/var/lib/thread
    healthcheck:
      test: ["CMD", "ot-ctl", "state"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 1m

  # Nanit baby monitor RTMP bridge for Home Assistant
  nanit-bridge:
    container_name: nanit-bridge
    image: indiefan/nanit:1.3.5
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - nanit_data:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - home_automation
    ports:
      - "1935:1935"
    environment:
      - TZ=${TIMEZONE:-America/New_York}
      - NANIT_RTMP_ADDR=${NANIT_RTMP_ADDR:-192.168.1.85:1935}
      - NANIT_LOG_LEVEL=${NANIT_LOG_LEVEL:-info}
      - NANIT_EMAIL=${NANIT_EMAIL}
      - NANIT_PASSWORD=${NANIT_PASSWORD}
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # Matter Server for Home Assistant
  matter-server:
    container_name: matter-server
    image: ghcr.io/home-assistant-libs/python-matter-server:8.1.0
    restart: unless-stopped
    logging: *default-logging
    network_mode: host
    privileged: true
    environment:
      - TZ=${TIMEZONE:-America/New_York}
      - MATTER_SERVER_LOG_LEVEL=info
    volumes:
      - matter_data:/data
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    depends_on:
      - otbr
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5580/info"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  mosquitto_config:
    driver: local
  mosquitto_data:
    driver: local
  mosquitto_logs:
    driver: local
  node_red_data:
    driver: local
  zwave_data:
    driver: local
  home_assistant_config:
    driver: local
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  otbr_data:
    driver: local
  matter_data:
    driver: local
  esphome_config:
    driver: local
  nanit_data:
    driver: local

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  frigate_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
  home_automation:
    external: true
    name: home-automation_home_automation
  traefik:
    external: true
    name: traefik

services:
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:0.17.2
    restart: unless-stopped
    logging: *default-logging
    # CAP_PERFMON lets intel_gpu_top report GPU stats without privileged mode
    cap_add:
      - PERFMON
    shm_size: '2g'
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      # State (db, model cache, JWT secret) lives in the volume; the config
      # file itself is the repo copy, found via CONFIG_FILE below.
      - frigate_config:/config
      - ./config:/repo-config
      - frigate_media:/media/frigate
      - /etc/localtime:/etc/localtime:ro
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    networks:
      - frigate_network
      - home_automation
      - traefik
    ports:
      # 5000 (unauthenticated) stays internal: Traefik and Node-RED reach it
      # over the Docker networks. 8971 is the authenticated UI/API.
      - "8971:8971"
      # WebRTC for live view (Frigate's embedded go2rtc). RTSP 8554 stays internal.
      - "8555:8555/tcp"
      - "8555:8555/udp"
    environment:
      - TZ=${TIMEZONE:-America/New_York}
      - CONFIG_FILE=/repo-config/config.yml
      - FRIGATE_MQTT_USER=${FRIGATE_MQTT_USER:?set FRIGATE_MQTT_USER in .env}
      - FRIGATE_MQTT_PASSWORD=${FRIGATE_MQTT_PASSWORD:?set FRIGATE_MQTT_PASSWORD in .env}
      - FRIGATE_RTSP_DOORBELL=${FRIGATE_RTSP_DOORBELL:?set FRIGATE_RTSP_DOORBELL in .env}
      - FRIGATE_RTSP_DOORBELL_HIGH=${FRIGATE_RTSP_DOORBELL_HIGH:?set FRIGATE_RTSP_DOORBELL_HIGH in .env}
      - FRIGATE_RTSP_FRONT_DOOR=${FRIGATE_RTSP_FRONT_DOOR:?set FRIGATE_RTSP_FRONT_DOOR in .env}
      - FRIGATE_RTSP_FRONT_DOOR_HIGH=${FRIGATE_RTSP_FRONT_DOOR_HIGH:?set FRIGATE_RTSP_FRONT_DOOR_HIGH in .env}
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'ffmpeg' > /dev/null && pgrep -f 'frigate' > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 3m
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.frigate.rule=Host(`frigate.martin-ohana.com`)"
      - "traefik.http.routers.frigate.tls=true"
      - "traefik.http.routers.frigate.tls.certresolver=cloudflare"
      - "traefik.http.routers.frigate.entrypoints=websecure"
      - "traefik.http.routers.frigate.middlewares=local-only@file"
      - "traefik.http.services.frigate.loadbalancer.server.port=5000"

volumes:
  frigate_config:
    driver: local
  frigate_media:
    driver: local

services:
  vaultwarden:
    image: vaultwarden/server:1.37.4-alpine
    container_name: vaultwarden
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - vaultwarden_data:/data
    networks:
      - traefik
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1/alive >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`vaultwarden.martin-ohana.com`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden.tls.certresolver=cloudflare"
      - "traefik.http.routers.vaultwarden.service=vaultwarden"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"
volumes:
  vaultwarden_data:

networks:
  traefik:
    external: true

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  portainer_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
  traefik:
    external: true

services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ee:2.45.3
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
      - /:/host:ro
    networks:
      - portainer_network
      - traefik
    ports:
      # UI is served through Traefik (port 9000 over the traefik network)
      - "127.0.0.1:9443:9443"
    environment:
      - TZ=${TIMEZONE:-America/New_York}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.portainer.rule=Host(`portainer.martin-ohana.com`)"
      - "traefik.http.routers.portainer.entrypoints=websecure"
      - "traefik.http.routers.portainer.tls=true"
      - "traefik.http.routers.portainer.tls.certresolver=cloudflare"
      - "traefik.http.routers.portainer.middlewares=local-only@file"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"

  portainer-agent:
    container_name: portainer-agent
    image: portainer/agent:2.45.3
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/volumes:/var/lib/docker/volumes:ro
      - /etc/localtime:/etc/localtime:ro
    # Not published: Portainer reaches the agent at portainer-agent:9001 over
    # portainer_network. Publishing 9001 without AGENT_SECRET exposes the
    # Docker API to the LAN.
    networks:
      - portainer_network
    environment:
      - TZ=${TIMEZONE:-America/New_York}
      - AGENT_CLUSTER_ADDR=portainer-agent
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  portainer_data:
    driver: local
